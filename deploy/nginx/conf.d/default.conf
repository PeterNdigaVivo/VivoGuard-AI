# =====================================================================
# VivoGuard AI — reverse proxy + TLS termination.
#
# Loaded via /etc/nginx/conf.d/default.conf, which the stock nginx image's
# /etc/nginx/nginx.conf includes inside its http{} block. Do NOT add
# worker_processes / events / an http{} wrapper here — those live in the
# base nginx.conf. This is where the container actually reads server config.
#
#   :80  → ACME challenge passthrough + 301 redirect to HTTPS
#   :443 → TLS (Let's Encrypt certs mounted at /etc/letsencrypt) proxying
#          /  → frontend, /api/ → FastAPI, /ws/ → FastAPI WebSockets
# =====================================================================

# WebSocket Upgrade handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vivoguard_api      { server api:8000; keepalive 32; }
upstream vivoguard_frontend { server frontend:80; }

# --- HTTP (port 80): ACME passthrough + redirect to HTTPS ---------------
server {
    listen 80 default_server;
    server_name _;

    # Keep Let's Encrypt HTTP-01 renewal working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) ---------------------------------------------------
server {
    listen 443 ssl;
    http2  on;
    server_name vivoops.vivofashiongroup.net;

    ssl_certificate     /etc/letsencrypt/live/vivoops.vivofashiongroup.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivoops.vivofashiongroup.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    # Streams (live MJPEG, video clips) need large bodies + long timeouts.
    client_max_body_size 200m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_buffering      off;

    # Frontend (SPA)
    location / {
        proxy_pass http://vivoguard_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass http://vivoguard_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (alerts feed, live frames, training log)
    location /ws/ {
        proxy_pass http://vivoguard_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}
