# =====================================================================
# VivoGuard AI — Nginx reverse proxy
# - Serves the React frontend at /
# - Proxies /api/  → backend FastAPI (REST)
# - Proxies /ws/   → backend WebSockets (with Upgrade headers)
# - Proxies /s3/   → MinIO (for direct thumb/clip downloads, optional)
# - Listens on 80 (HTTP) and 443 (HTTPS).  HTTP redirects to HTTPS if
#   ssl/cert.pem + ssl/key.pem are present.  Otherwise plain HTTP works.
# =====================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Streams (live MJPEG, video clips) need large bodies + long timeouts.
    client_max_body_size 200m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_buffering      off;

    # Map for WebSocket Upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Upstreams --------------------------------------------------
    upstream vivoguard_api      { server api:8000; keepalive 32; }
    upstream vivoguard_frontend { server frontend:80; }
    upstream vivoguard_minio    { server minio:9000; }

    # --- HTTP (port 80) --------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        # ACME challenge passthrough for Let's Encrypt certbot.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Frontend
        location / {
            proxy_pass http://vivoguard_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API
        location /api/ {
            proxy_pass http://vivoguard_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets (alerts feed, live frames, training log)
        location /ws/ {
            proxy_pass http://vivoguard_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # Optional direct MinIO passthrough (presigned URLs work without this).
        location /s3/ {
            rewrite ^/s3/(.*) /$1 break;
            proxy_pass http://vivoguard_minio;
            proxy_set_header Host $host;
        }
    }

    # --- HTTPS (port 443) ------------------------------------------
    # If certs are mounted at /etc/nginx/ssl/{cert.pem,key.pem} this server
    # block becomes active. Comment out if you only run HTTP behind another
    # TLS terminator (e.g. Cloudflare).
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        location / {
            proxy_pass http://vivoguard_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            proxy_pass http://vivoguard_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /ws/ {
            proxy_pass http://vivoguard_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }
    }
}
