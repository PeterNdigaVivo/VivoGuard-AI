# =====================================================================
# VivoGuard AI — Nginx reverse proxy (HTTP-only, no MinIO)
#
# Serves:
#   /         → React frontend (Nginx static)
#   /api/     → FastAPI backend (REST)
#   /ws/      → FastAPI WebSockets (alerts, live frames, training log)
#
# Intentionally absent:
#   - HTTPS (443) server block: TLS is terminated upstream (Cloudflare,
#     a load balancer, etc.) in our deployment. Re-add a 443 block here
#     only when you mount real certs into /etc/nginx/ssl/.
#   - MinIO upstream (/s3/): MinIO is opt-in via the
#     `--profile object-store` compose flag and is not part of the
#     default stack. The presigned-URL flow doesn't need a proxy rule
#     here anyway — the browser hits MinIO directly when enabled.
# =====================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Streams (live MJPEG, video clips) need large bodies + long timeouts.
    client_max_body_size 200m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_buffering      off;

    # Map for WebSocket Upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Upstreams --------------------------------------------------
    upstream vivoguard_api      { server api:8000; keepalive 32; }
    upstream vivoguard_frontend { server frontend:80; }

    # --- HTTP (port 80) --------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        # ACME challenge passthrough for Let's Encrypt certbot
        # (kept so adding TLS later doesn't require a config edit).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Frontend (SPA)
        location / {
            proxy_pass http://vivoguard_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API
        location /api/ {
            proxy_pass http://vivoguard_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets (alerts feed, live frames, training log)
        location /ws/ {
            proxy_pass http://vivoguard_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
    }
}
