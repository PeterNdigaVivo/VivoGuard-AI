events {}
http {
    # Docker service IPs change whenever Compose recreates a container. Resolve
    # on request instead of pinning the API/frontend address at nginx startup;
    # otherwise an otherwise healthy deployment returns public 502s until
    # nginx is manually restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name vivoops.vivofashiongroup.net;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name vivoops.vivofashiongroup.net;
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        set $api_upstream http://api:8000;
        set $frontend_upstream http://frontend:80;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
