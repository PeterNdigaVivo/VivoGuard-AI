# =====================================================================
# VivoGuard AI — Nginx reverse proxy (HTTPS/TLS terminated here)
#
# Serves:
#   /         → React frontend (Nginx static)
#   /api/     → FastAPI backend (REST)
#   /ws/      → FastAPI WebSockets (alerts, live frames, training log)
#
# TLS is terminated here using the Let's Encrypt certs mounted read-only
# from the host at /etc/letsencrypt (see docker-compose.yml nginx volumes).
# Port 80 keeps the ACME challenge passthrough so `certbot renew` works,
# and redirects everything else to HTTPS.
#
# MinIO upstream (/s3/) is intentionally absent — MinIO is opt-in via the
# `--profile object-store` compose flag and the browser hits it directly.
# =====================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Streams (live MJPEG, video clips) need large bodies + long timeouts.
    client_max_body_size 200m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_buffering      off;

    # Map for WebSocket Upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Upstreams --------------------------------------------------
    upstream vivoguard_api      { server api:8000; keepalive 32; }
    upstream vivoguard_frontend { server frontend:80; }

    # --- HTTP (port 80): ACME passthrough + redirect to HTTPS -------
    server {
        listen 80 default_server;
        server_name _;

        # Keep Let's Encrypt HTTP-01 renewal working.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS (port 443) -------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name vivoops.vivofashiongroup.net;

        ssl_certificate     /etc/letsencrypt/live/vivoops.vivofashiongroup.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vivoops.vivofashiongroup.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Frontend (SPA)
        location / {
            proxy_pass http://vivoguard_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API
        location /api/ {
            proxy_pass http://vivoguard_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets (alerts feed, live frames, training log)
        location /ws/ {
            proxy_pass http://vivoguard_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
    }
}
