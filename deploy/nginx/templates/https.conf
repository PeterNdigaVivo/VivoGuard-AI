# =====================================================================
# VivoGuard AI — reverse proxy + TLS termination (HTTPS profile).
#
# NOT loaded directly. The cert-presence guard
# (/docker-entrypoint.d/10-tls-guard.sh) copies THIS file to
# /etc/nginx/conf.d/default.conf at container start *only when* the TLS
# certs exist. If the certs are missing it installs http-only.conf
# instead so nginx serves the app on :80 rather than crash-looping.
#
#   :80  → ACME challenge passthrough + 301 redirect to HTTPS
#   :443 → TLS (Let's Encrypt certs mounted at /etc/letsencrypt) proxying
#          /  → frontend, /api/ → FastAPI, /ws/ → FastAPI WebSockets
# =====================================================================

# WebSocket Upgrade handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Compose recreates change container IPs. Resolve service names through
# Docker DNS at request time so a routine API/frontend deployment cannot
# strand nginx on a stale upstream and return public 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- HTTP (port 80): ACME passthrough + redirect to HTTPS ---------------
server {
    listen 80 default_server;
    server_name _;

    # Keep Let's Encrypt HTTP-01 renewal working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) ---------------------------------------------------
server {
    listen 443 ssl;
    http2  on;
    server_name vivoops.vivofashiongroup.net;

    ssl_certificate     /etc/letsencrypt/live/vivoops.vivofashiongroup.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivoops.vivofashiongroup.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    # Streams (live MJPEG, video clips) need large bodies + long timeouts.
    client_max_body_size 200m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_buffering      off;
    set $api_upstream api:8000;
    set $frontend_upstream frontend:80;

    # Frontend (SPA)
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (alerts feed, live frames, training log)
    location /ws/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}
