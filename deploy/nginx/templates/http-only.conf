# =====================================================================
# VivoGuard AI — reverse proxy, HTTP-ONLY fallback profile.
#
# NOT loaded directly. The cert-presence guard
# (/docker-entrypoint.d/10-tls-guard.sh) copies THIS file to
# /etc/nginx/conf.d/default.conf *only when* the TLS certs are missing,
# so nginx starts and serves the app on :80 instead of crash-looping on
# "cannot load certificate ... No such file or directory".
#
# Everything (frontend, /api/, /ws/) is served over plain HTTP on :80.
# The ACME challenge location is kept so `certbot` can still obtain the
# first certificate — once it lands, restart the nginx container and the
# guard switches back to the HTTPS profile automatically.
# =====================================================================

# WebSocket Upgrade handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Compose recreates change container IPs. Resolve service names through
# Docker DNS at request time so a routine API/frontend deployment cannot
# strand nginx on a stale upstream and return public 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    # Keep Let's Encrypt HTTP-01 issuance working so certs can be obtained.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    server_tokens off;
    client_max_body_size 200m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_buffering      off;
    set $api_upstream api:8000;
    set $frontend_upstream frontend:80;

    # Frontend (SPA)
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (alerts feed, live frames, training log)
    location /ws/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}
