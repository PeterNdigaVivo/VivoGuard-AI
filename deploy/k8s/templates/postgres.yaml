{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vivoguard-postgres
spec:
  serviceName: vivoguard-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: postgres, app.kubernetes.io/name: vivoguard }
  template:
    metadata:
      labels: { app.kubernetes.io/component: postgres, app.kubernetes.io/name: vivoguard }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB,   value: "vivoguard" }
            - { name: POSTGRES_USER, value: "vivoguard" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: vivoguard-secrets, key: postgres-password } }
          ports: [{ containerPort: 5432 }]
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data, subPath: pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "vivoguard", "-d", "vivoguard"] }
            initialDelaySeconds: 5
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources: { requests: { storage: {{ .Values.postgres.persistence.size }} } }
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: vivoguard-postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports: [{ port: 5432, targetPort: 5432, name: pg }]
  selector: { app.kubernetes.io/component: postgres, app.kubernetes.io/name: vivoguard }
{{- end }}
