{{- $component := "frontend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vivoguard-frontend
  labels: { {{- include "vg.labels" (dict "Release" .Release "component" $component) | nindent 4 }} }
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { {{- include "vg.matchLabels" (dict "Release" .Release "component" $component) | nindent 6 }} }
  template:
    metadata:
      labels: { {{- include "vg.labels" (dict "Release" .Release "component" $component) | nindent 8 }} }
    spec:
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      containers:
        - name: frontend
          image: {{ include "vg.image" (dict "Values" .Values "component" $component) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vivoguard-frontend
spec:
  type: ClusterIP
  ports: [{ port: 80, targetPort: 80, name: http }]
  selector: { {{- include "vg.matchLabels" (dict "Release" .Release "component" $component) | nindent 4 }} }
