{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vivoguard-minio
spec:
  serviceName: vivoguard-minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: minio, app.kubernetes.io/name: vivoguard }
  template:
    metadata:
      labels: { app.kubernetes.io/component: minio, app.kubernetes.io/name: vivoguard }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: "minioadmin" }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: vivoguard-secrets, key: s3-secret-key } }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: mdata, mountPath: /data, subPath: minio }
  volumeClaimTemplates:
    - metadata: { name: mdata }
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources: { requests: { storage: {{ .Values.minio.persistence.size }} } }
        {{- with .Values.minio.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: vivoguard-minio
spec:
  type: ClusterIP
  ports:
    - { port: 9000, targetPort: 9000, name: api }
    - { port: 9001, targetPort: 9001, name: console }
  selector: { app.kubernetes.io/component: minio, app.kubernetes.io/name: vivoguard }
{{- end }}
