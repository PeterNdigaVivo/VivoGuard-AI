{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vivoguard-redis
spec:
  serviceName: vivoguard-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: redis, app.kubernetes.io/name: vivoguard }
  template:
    metadata:
      labels: { app.kubernetes.io/component: redis, app.kubernetes.io/name: vivoguard }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes",
                 "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: rdata, mountPath: /data, subPath: redis }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
  volumeClaimTemplates:
    - metadata: { name: rdata }
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources: { requests: { storage: {{ .Values.redis.persistence.size }} } }
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: vivoguard-redis
spec:
  type: ClusterIP
  ports: [{ port: 6379, targetPort: 6379, name: redis }]
  selector: { app.kubernetes.io/component: redis, app.kubernetes.io/name: vivoguard }
{{- end }}
