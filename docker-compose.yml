# =====================================================================
# VivoGuard AI — full stack
# Bring up:  docker compose up -d
# Tear down: docker compose down (-v to wipe data)
#
# All services live on the internal `vivoguard` network.
# Only Nginx exposes ports to the host.
# =====================================================================
name: vivoguard

# --- Reusable env block ---------------------------------------------------
x-app-env: &app-env
  # System clock — every container reads this at startup. EAT (UTC+3)
  # is the chain-wide default since 24 of 26 Vivo stores are in Kenya
  # / Uganda / Rwanda (all UTC+3 / UTC+2). Override via .env if a
  # specific deployment lives elsewhere.
  TZ: ${TZ:-Africa/Nairobi}
  APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Nairobi}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_CLIPS: ${S3_BUCKET_CLIPS:-clips}
  S3_BUCKET_THUMBS: ${S3_BUCKET_THUMBS:-thumbnails}
  S3_BUCKET_MODELS: ${S3_BUCKET_MODELS:-models}
  S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-datasets}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  CREDENTIALS_FERNET_KEY: ${CREDENTIALS_FERNET_KEY}
  USE_GPU: ${USE_GPU:-false}
  CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
  # AI hardware backend (runtime side — mirrors the build ARG so
  # env_config logs which backend the image was built for). Inference
  # still auto-detects actual hardware at startup.
  GPU_BACKEND: ${GPU_BACKEND:-cpu}
  USE_OPTIMIZED: ${USE_OPTIMIZED:-true}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-yolov8n.pt}
  INFERENCE_FPS: ${INFERENCE_FPS:-3}
  INFERENCE_FPS_DEFAULT: ${INFERENCE_FPS_DEFAULT:-5}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-alerts@vivoguard.local}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_AUTH_HEADER: ${WEBHOOK_AUTH_HEADER:-}
  DDNS_REFRESH_INTERVAL_SECONDS: ${DDNS_REFRESH_INTERVAL_SECONDS:-300}
  WAN_RECONNECT_INITIAL_DELAY_SECONDS: ${WAN_RECONNECT_INITIAL_DELAY_SECONDS:-5}
  WAN_RECONNECT_MAX_DELAY_SECONDS: ${WAN_RECONNECT_MAX_DELAY_SECONDS:-300}
  WAN_OFFLINE_ALERT_THRESHOLD_SECONDS: ${WAN_OFFLINE_ALERT_THRESHOLD_SECONDS:-120}
  RECORDINGS_DIR: /data/recordings
  MODELS_DIR: /data/models
  DATASETS_DIR: /data/datasets
  THUMBNAILS_DIR: /data/thumbnails

# --- GPU reservation block (used by api + worker; no-op if USE_GPU=false) -
x-gpu: &gpu-reservation
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# =====================================================================
services:

  # --- API: slim image (~300 MB) --- No torch, no ultralytics, no opencv.
  # Scale this independently of the worker pool.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    image: vivoguard/api:latest
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    # `docker compose up --scale api=3` to run multiple replicas behind nginx.

  # --- Inference worker (camera AI). 14 concurrent slots dedicated
  # to the long-running inference.run_camera tasks. Also runs Beat
  # (`-B`) for the inference supervisor that wakes the pipeline every
  # 30 s. Listens on the `inference` + `default` queues so it never
  # picks up a 5-min sales-floor / shop-not-opened task and blocks
  # the camera pipeline.
  worker-inference:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    image: vivoguard/worker:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A app.tasks.celery_app worker -B -Q inference,default --loglevel=info --concurrency=${WORKER_INFERENCE_CONCURRENCY:-14} -n inference-worker@%h"
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]
    # GPU passthrough — uncomment once the host has nvidia-container-toolkit
    # and you've rebuilt with `GPU_BACKEND=cuda`.
    # <<: *gpu-reservation

  # --- Alerts / bookkeeping worker. 4 slots dedicated to the short
  # tasks the operations team depends on (sales-floor insight,
  # shop-not-opened, queue escalation, camera health, uniform
  # violation, daily summaries). Lives on `alerts` + `beat` queues so
  # it never competes with the inference pool for runtime.
  # No `-B` flag — Beat is owned by the inference worker.
  worker-alerts:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    image: vivoguard/worker:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A app.tasks.celery_app worker -Q alerts,beat --loglevel=info --concurrency=${WORKER_ALERTS_CONCURRENCY:-4} -n alerts-worker@%h"
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]

  # --- Recorder: rolling video recording of KEY cameras during business
  # hours. Dedicated service on its OWN queue so its long-lived ffmpeg
  # subprocesses survive rebuilds of the inference/alerts workers. Uses the
  # worker image (has ffmpeg + backend code). No `-B` — Beat (owned by the
  # inference worker) dispatches recorder.* tasks onto the `recorder` queue.
  # Concurrency 2: the tick and clip-extraction tasks are light; the actual
  # recordings are detached ffmpeg processes, not celery task runtime.
  recorder:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    image: vivoguard/worker:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A app.tasks.celery_app worker -Q recorder --loglevel=info --concurrency=${RECORDER_CONCURRENCY:-2} -n recorder@%h"
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]

  # --- Streamer: ffmpeg subprocess pool. Slim image, no torch.
  #
  # Horizontal scaling: each replica claims `id % SHARD_COUNT == SHARD_INDEX`.
  # With defaults (count=1, index=0) the single container handles every
  # camera. For 100+ cameras, deploy 2-3 replicas via the override file
  # `docker-compose.scale.yml` (run with `-f docker-compose.yml
  # -f docker-compose.scale.yml up -d`).
  streamer:
    build:
      context: ./streamer
      dockerfile: Dockerfile
    image: vivoguard/streamer:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      STREAMER_SHARD_COUNT: ${STREAMER_SHARD_COUNT:-1}
      STREAMER_SHARD_INDEX: ${STREAMER_SHARD_INDEX:-0}
    volumes:
      - ./data/recordings:/data/recordings
    depends_on:
      redis: { condition: service_healthy }
      api:   { condition: service_started }
    networks: [vivoguard]

  # --- Frontend: Nginx serving the built React bundle -----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vivoguard/frontend:latest
    container_name: vivoguard-frontend
    restart: unless-stopped
    networks: [vivoguard]

  # --- Postgres -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vivoguard-postgres
    restart: unless-stopped
    environment:
      # Server-side clock — every now() / current_timestamp call
      # returns EAT. Stored values stay timestamptz (UTC under the
      # hood); the difference is what an admin SQL session sees and
      # how date_trunc('day', now()) lands.
      TZ: ${TZ:-Africa/Nairobi}
      PGTZ: ${TZ:-Africa/Nairobi}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "timezone=Africa/Nairobi"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [vivoguard]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis: Celery broker + frame buffer ----------------------------
  redis:
    image: redis:7-alpine
    container_name: vivoguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [vivoguard]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- MinIO: S3-compatible object store ------------------------------
  # OPTIONAL — opt in with `docker compose --profile object-store up -d`.
  # Default deployments use the bind-mounted ./data/* directories below,
  # which is enough for single-node installs and avoids ~250 MB of MinIO.
  # For cloud / multi-node, point CREDENTIALS_FERNET_KEY-style envs at
  # AWS S3 (set S3_ENDPOINT=https://s3.<region>.amazonaws.com) instead
  # of running this container.
  minio:
    image: minio/minio:latest
    container_name: vivoguard-minio
    restart: unless-stopped
    profiles: ["object-store"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [vivoguard]

  # --- Nginx: TLS termination + reverse proxy -------------------------
  nginx:
    image: nginx:alpine
    container_name: vivoguard-nginx
    restart: unless-stopped
    # HTTP only — nginx.conf currently has no 443 server block. TLS is
    # terminated upstream (Cloudflare, ALB, etc.). To add native HTTPS:
    # drop real certs into ./deploy/ssl/, restore a `listen 443 ssl http2;`
    # block in nginx.conf, and add "443:443" to the ports list.
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks: [vivoguard]

# =====================================================================
networks:
  vivoguard:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
