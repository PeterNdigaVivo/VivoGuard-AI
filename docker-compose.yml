# =====================================================================
# VivoGuard AI — full stack
# Bring up:  docker compose up -d
# Tear down: docker compose down (-v to wipe data)
#
# All services live on the internal `vivoguard` network.
# Only Nginx exposes ports to the host.
# =====================================================================
name: vivoguard

# --- Reusable env block ---------------------------------------------------
x-app-env: &app-env
  # System clock — every container reads this at startup. EAT (UTC+3)
  # is the chain-wide default since 24 of 26 Vivo stores are in Kenya
  # / Uganda / Rwanda (all UTC+3 / UTC+2). Override via .env if a
  # specific deployment lives elsewhere.
  TZ: ${TZ:-Africa/Nairobi}
  APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Nairobi}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  ODOO_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-}
  ODOO_WEBHOOK_MAX_AGE_SECONDS: ${ODOO_WEBHOOK_MAX_AGE_SECONDS:-300}
  # One-way, read-only Odoo pull integration. Credentials remain in the
  # deployment .env/secret store and are never baked into an image.
  ODOO_SYNC_ENABLED: ${ODOO_SYNC_ENABLED:-false}
  ODOO_URL: ${ODOO_URL:-}
  ODOO_DB: ${ODOO_DB:-}
  ODOO_USER: ${ODOO_USER:-}
  ODOO_API_KEY: ${ODOO_API_KEY:-}
  ODOO_MASTER_CRON: ${ODOO_MASTER_CRON:-15 2 * * *}
  ODOO_TXN_MINUTES: ${ODOO_TXN_MINUTES:-15}
  ODOO_HOURS_MAX_AGE_HOURS: ${ODOO_HOURS_MAX_AGE_HOURS:-48}
  ODOO_ROSTER_MAX_AGE_HOURS: ${ODOO_ROSTER_MAX_AGE_HOURS:-24}
  ODOO_ROSTER_RETENTION_DAYS: ${ODOO_ROSTER_RETENTION_DAYS:-45}
  ODOO_REQUEST_TIMEOUT_SECONDS: ${ODOO_REQUEST_TIMEOUT_SECONDS:-10}
  ODOO_PAGE_SIZE: ${ODOO_PAGE_SIZE:-200}
  ODOO_CONVERSION_MAX: ${ODOO_CONVERSION_MAX:-0.60}
  ODOO_CHANGING_ROOM_GRACE_MINUTES: ${ODOO_CHANGING_ROOM_GRACE_MINUTES:-15}
  ODOO_CIRCUIT_FAILURES: ${ODOO_CIRCUIT_FAILURES:-3}
  ODOO_CIRCUIT_COOLDOWN_MINUTES: ${ODOO_CIRCUIT_COOLDOWN_MINUTES:-30}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_CLIPS: ${S3_BUCKET_CLIPS:-clips}
  S3_BUCKET_THUMBS: ${S3_BUCKET_THUMBS:-thumbnails}
  S3_BUCKET_MODELS: ${S3_BUCKET_MODELS:-models}
  S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-datasets}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  CREDENTIALS_FERNET_KEY: ${CREDENTIALS_FERNET_KEY}
  USE_GPU: ${USE_GPU:-false}
  CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
  # AI hardware backend (runtime side — mirrors the build ARG so
  # env_config logs which backend the image was built for). Inference
  # still auto-detects actual hardware at startup.
  GPU_BACKEND: ${GPU_BACKEND:-cpu}
  USE_OPTIMIZED: ${USE_OPTIMIZED:-true}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-yolov8n.pt}
  INFERENCE_FPS: ${INFERENCE_FPS:-3}
  INFERENCE_FPS_DEFAULT: ${INFERENCE_FPS_DEFAULT:-5}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-alerts@vivoguard.local}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_AUTH_HEADER: ${WEBHOOK_AUTH_HEADER:-}
  DDNS_REFRESH_INTERVAL_SECONDS: ${DDNS_REFRESH_INTERVAL_SECONDS:-300}
  WAN_RECONNECT_INITIAL_DELAY_SECONDS: ${WAN_RECONNECT_INITIAL_DELAY_SECONDS:-5}
  WAN_RECONNECT_MAX_DELAY_SECONDS: ${WAN_RECONNECT_MAX_DELAY_SECONDS:-300}
  WAN_OFFLINE_ALERT_THRESHOLD_SECONDS: ${WAN_OFFLINE_ALERT_THRESHOLD_SECONDS:-120}
  RECORDINGS_DIR: /data/recordings
  MODELS_DIR: /data/models
  DATASETS_DIR: /data/datasets
  THUMBNAILS_DIR: /data/thumbnails
  # AI / inference tuning — mirrored into the repo so a git pull never
  # conflicts with server-side edits. All ${VAR:-default} passthroughs;
  # real values (e.g. ANTHROPIC_API_KEY) live only in .env.
  MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/data/models/optimized}
  REID_ENABLED: ${REID_ENABLED:-false}
  VLM_ENABLED: ${VLM_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AGENTS_LLM_ENABLED: ${AGENTS_LLM_ENABLED:-false}
  AGENTS_LLM_PROVIDER: ${AGENTS_LLM_PROVIDER:-anthropic}
  AGENTS_LLM_FALLBACK_PROVIDER: ${AGENTS_LLM_FALLBACK_PROVIDER:-openai}
  AGENTS_LLM_MODEL: ${AGENTS_LLM_MODEL:-claude-sonnet-4-6}
  AGENTS_LLM_OPENAI_MODEL: ${AGENTS_LLM_OPENAI_MODEL:-gpt-5.4-mini}
  AGENTS_LLM_TIMEOUT_SECONDS: ${AGENTS_LLM_TIMEOUT_SECONDS:-45}
  CELERYD_CONCURRENCY: ${CELERYD_CONCURRENCY:-10}
  CELERYD_MAX_TASKS_PER_CHILD: ${CELERYD_MAX_TASKS_PER_CHILD:-500}
  FRAME_BUFFER_SIZE: ${FRAME_BUFFER_SIZE:-5}
  CHECKOUT_MIN_FRAMES: ${CHECKOUT_MIN_FRAMES:-5}
  CHECKOUT_ALERT_MINUTES: ${CHECKOUT_ALERT_MINUTES:-3}
  POSITIVE_AGENT_ALERTS_ENABLED: ${POSITIVE_AGENT_ALERTS_ENABLED:-true}
  POSITIVE_AGENT_ALERT_DEDUP_HOURS: ${POSITIVE_AGENT_ALERT_DEDUP_HOURS:-6}
  UNIFORM_CONFIDENCE_THRESHOLD: ${UNIFORM_CONFIDENCE_THRESHOLD:-0.65}
  TRESPASS_MIN_FRAMES: ${TRESPASS_MIN_FRAMES:-5}
  COUNTER_MIN_EMPTY_FRAMES: ${COUNTER_MIN_EMPTY_FRAMES:-10}
  ENTRY_EXIT_MIN_FRAMES_PER_SIDE: ${ENTRY_EXIT_MIN_FRAMES_PER_SIDE:-1}
  # Store Intelligence 45-min BI update — re-enabled Aug 2026 (the
  # Jul pause emptied the Store Update tab for a month). NB: this
  # compose fallback overrides the Python default — keep both in sync.
  STORE_INTELLIGENCE_ENABLED: ${STORE_INTELLIGENCE_ENABLED:-true}
  # Training-pipeline hardening (ML audit): combined-dataset floor,
  # anti-forgetting replay fraction, blur-exclusion threshold.
  MIN_TRAINING_IMAGES: ${MIN_TRAINING_IMAGES:-50}
  BASE_MIX_FRACTION: ${BASE_MIX_FRACTION:-0.18}
  SANITIZE_BLUR_THRESHOLD: ${SANITIZE_BLUR_THRESHOLD:-25.0}
  MODEL_GATE_MAX_REGRESSION: ${MODEL_GATE_MAX_REGRESSION:-0.0}
  METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-90}
  INCIDENT_FOUNDATIONS_ENABLED: ${INCIDENT_FOUNDATIONS_ENABLED:-false}
  DELIVERY_OUTBOX_ENABLED: ${DELIVERY_OUTBOX_ENABLED:-false}
  # Temporal alert gate — ops runs 4 (10 frames = 5-10s at 1-2 fps).
  TEMPORAL_GATE_MIN_FRAMES: ${TEMPORAL_GATE_MIN_FRAMES:-10}
  # Live Activity Sentinel — dark-launched; enable per rollout plan.
  ACTIVITY_SENTINEL_ENABLED: ${ACTIVITY_SENTINEL_ENABLED:-false}
  ACTIVITY_SURGE_PEOPLE: ${ACTIVITY_SURGE_PEOPLE:-12}
  ACTIVITY_SURGE_SUSTAIN_SAMPLES: ${ACTIVITY_SURGE_SUSTAIN_SAMPLES:-3}
  ACTIVITY_STORE_SURGE_PEOPLE: ${ACTIVITY_STORE_SURGE_PEOPLE:-30}
  ACTIVITY_DEAD_SCENE_MINUTES: ${ACTIVITY_DEAD_SCENE_MINUTES:-0}
  ACTIVITY_SENTINEL_INTERVAL_SECONDS: ${ACTIVITY_SENTINEL_INTERVAL_SECONDS:-60}
  MANNEQUIN_FILTER_ENABLED: ${MANNEQUIN_FILTER_ENABLED:-true}
  ACTIVITY_STATIC_DISPLACEMENT_PX: ${ACTIVITY_STATIC_DISPLACEMENT_PX:-5}
  ACTIVITY_STATIC_WINDOW_FRAMES: ${ACTIVITY_STATIC_WINDOW_FRAMES:-10}
  ACTIVITY_PRESENCE_ENABLED: ${ACTIVITY_PRESENCE_ENABLED:-true}
  ACTIVITY_PRESENCE_THRESHOLD: ${ACTIVITY_PRESENCE_THRESHOLD:-5}
  ACTIVITY_PRESENCE_SUSTAIN_SAMPLES: ${ACTIVITY_PRESENCE_SUSTAIN_SAMPLES:-2}

# --- GPU reservation block (used by api + worker; no-op if USE_GPU=false) -
x-gpu: &gpu-reservation
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# =====================================================================
services:

  # --- API: slim image (~300 MB) --- No torch, no ultralytics, no opencv.
  # Scale this independently of the worker pool.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    image: vivoguard/api:latest
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    # `docker compose up --scale api=3` to run multiple replicas behind nginx.

  # --- Inference worker (camera AI). Eight concurrent slots by default.
  # The 30 GiB CPU host repeatedly OOM-killed 4+ GiB inference children
  # with the old concurrency of 14. Eight keeps useful camera parallelism,
  # while Celery recycles a child after a task if it exceeds 1.5 GiB RSS.
  # Sites with measured memory headroom can override concurrency explicitly.
  # Slots are dedicated to long-running inference.run_camera tasks. It also
  # runs Beat
  # (`-B`) for the inference supervisor that wakes the pipeline every
  # 30 s. Listens on the `inference` + `default` queues so it never
  # picks up a 5-min sales-floor / shop-not-opened task and blocks
  # the camera pipeline.
  worker-inference:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    image: vivoguard/worker:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A app.tasks.celery_app worker -B -Q inference,default --loglevel=info --concurrency=${WORKER_INFERENCE_CONCURRENCY:-8} --max-memory-per-child=${WORKER_INFERENCE_MAX_MEMORY_KIB:-1572864} -n inference-worker@%h"
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]
    # GPU passthrough — uncomment once the host has nvidia-container-toolkit
    # and you've rebuilt with `GPU_BACKEND=cuda`.
    # <<: *gpu-reservation

  # --- Alerts / bookkeeping worker. TWO processes (Aug 2026 split):
  #   beat-runner    -Q beat, 1 slot — scheduled/lightweight tasks
  #                  (status report, dispatchers, watchdogs, sentinel).
  #   alerts-worker  -Q alerts, 4 slots — notifications, harvests,
  #                  previews and VLM (never model fitting).
  # Split because simultaneous training jobs filled every shared slot
  # and beat-queue tasks (incl. the daily status report) waited
  # 30-60+ min behind them. `exec` keeps the main worker as PID
  # owner so compose restart semantics stay intact.
  # No `-B` flag — Beat is owned by the inference worker.
  worker-alerts:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    image: vivoguard/worker:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A app.tasks.celery_app worker -Q beat --loglevel=info --concurrency=1 -n beat-runner@%h & exec celery -A app.tasks.celery_app worker -Q alerts --loglevel=info --concurrency=${WORKER_ALERTS_CONCURRENCY:-4} -n alerts-worker@%h"
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
      # Read-only shared access lets the frontend assurance agent inspect
      # actual proxy responses instead of reporting an observability gap.
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]

  # --- Training worker. One fitting process at a time on CPU. Keeping this
  # queue separate prevents training from consuming alert-delivery slots and
  # prevents an alerts-worker restart from killing an active training job.
  worker-training:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    image: vivoguard/worker:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A app.tasks.celery_app worker -Q training --loglevel=info --concurrency=${WORKER_TRAINING_CONCURRENCY:-1} -n training-worker@%h"
    environment: *app-env
    volumes:
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]

  # --- Recorder: rolling video recording of KEY cameras during business
  # hours. Dedicated service on its OWN queue so its long-lived ffmpeg
  # subprocesses survive rebuilds of the inference/alerts workers. Uses the
  # worker image (has ffmpeg + backend code). No `-B` — Beat (owned by the
  # inference worker) dispatches recorder.* tasks onto the `recorder` queue.
  # Concurrency 2: the tick and clip-extraction tasks are light; the actual
  # recordings are detached ffmpeg processes, not celery task runtime.
  recorder:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    image: vivoguard/worker:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A app.tasks.celery_app worker -Q recorder --loglevel=info --concurrency=${RECORDER_CONCURRENCY:-2} -n recorder@%h"
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]

  # --- Streamer: ffmpeg subprocess pool. Slim image, no torch.
  #
  # Horizontal scaling: each replica claims `id % SHARD_COUNT == SHARD_INDEX`.
  # With defaults (count=1, index=0) the single container handles every
  # camera. For 100+ cameras, deploy 2-3 replicas via the override file
  # `docker-compose.scale.yml` (run with `-f docker-compose.yml
  # -f docker-compose.scale.yml up -d`).
  streamer:
    build:
      context: ./streamer
      dockerfile: Dockerfile
    image: vivoguard/streamer:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      STREAMER_SHARD_COUNT: ${STREAMER_SHARD_COUNT:-1}
      STREAMER_SHARD_INDEX: ${STREAMER_SHARD_INDEX:-0}
    volumes:
      - ./data/recordings:/data/recordings
    depends_on:
      redis: { condition: service_healthy }
      api:   { condition: service_started }
    networks: [vivoguard]

  # --- Frontend: Nginx serving the built React bundle -----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vivoguard/frontend:latest
    container_name: vivoguard-frontend
    restart: unless-stopped
    networks: [vivoguard]

  # --- Postgres -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vivoguard-postgres
    restart: unless-stopped
    environment:
      # Server-side clock — every now() / current_timestamp call
      # returns EAT. Stored values stay timestamptz (UTC under the
      # hood); the difference is what an admin SQL session sees and
      # how date_trunc('day', now()) lands.
      TZ: ${TZ:-Africa/Nairobi}
      PGTZ: ${TZ:-Africa/Nairobi}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "timezone=Africa/Nairobi"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [vivoguard]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis: Celery broker + frame buffer ----------------------------
  redis:
    image: redis:7-alpine
    container_name: vivoguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [vivoguard]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- MinIO: S3-compatible object store ------------------------------
  # OPTIONAL — opt in with `docker compose --profile object-store up -d`.
  # Default deployments use the bind-mounted ./data/* directories below,
  # which is enough for single-node installs and avoids ~250 MB of MinIO.
  # For cloud / multi-node, point CREDENTIALS_FERNET_KEY-style envs at
  # AWS S3 (set S3_ENDPOINT=https://s3.<region>.amazonaws.com) instead
  # of running this container.
  minio:
    image: minio/minio:latest
    container_name: vivoguard-minio
    restart: unless-stopped
    profiles: ["object-store"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [vivoguard]

  # --- Nginx: TLS termination + reverse proxy -------------------------
  nginx:
    image: nginx:alpine
    container_name: vivoguard-nginx
    restart: unless-stopped
    # TLS terminated here. The active server config is chosen at container
    # start by the cert-presence guard (10-tls-guard.sh): it copies the
    # HTTPS profile to conf.d/default.conf when the Let's Encrypt certs
    # exist, or the HTTP-only fallback when they are missing — so a missing
    # cert makes nginx serve plain HTTP on :80 instead of crash-looping.
    # NOTE: conf.d/default.conf is intentionally NOT mounted read-only —
    # the guard needs to write it. The candidate configs live under
    # ./deploy/nginx/templates and are mounted read-only at /etc/nginx/vg-templates.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/vg-templates:ro
      - ./deploy/nginx/docker-entrypoint.d/10-tls-guard.sh:/docker-entrypoint.d/10-tls-guard.sh:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      # Let's Encrypt certs from the host (read-only) — the HTTPS profile points at
      # /etc/letsencrypt/live/vivoops.vivofashiongroup.net/{fullchain,privkey}.pem
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend
    networks: [vivoguard]

# =====================================================================
networks:
  vivoguard:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  nginx_logs:
