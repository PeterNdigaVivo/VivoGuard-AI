# =====================================================================
# VivoGuard AI — full stack
# Bring up:  docker compose up -d
# Tear down: docker compose down (-v to wipe data)
#
# All services live on the internal `vivoguard` network.
# Only Nginx exposes ports to the host.
# =====================================================================
name: vivoguard

# --- Reusable env block ---------------------------------------------------
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_CLIPS: ${S3_BUCKET_CLIPS:-clips}
  S3_BUCKET_THUMBS: ${S3_BUCKET_THUMBS:-thumbnails}
  S3_BUCKET_MODELS: ${S3_BUCKET_MODELS:-models}
  S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-datasets}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  CREDENTIALS_FERNET_KEY: ${CREDENTIALS_FERNET_KEY}
  USE_GPU: ${USE_GPU:-false}
  CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-yolov8n.pt}
  INFERENCE_FPS_DEFAULT: ${INFERENCE_FPS_DEFAULT:-5}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-alerts@vivoguard.local}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_AUTH_HEADER: ${WEBHOOK_AUTH_HEADER:-}
  DDNS_REFRESH_INTERVAL_SECONDS: ${DDNS_REFRESH_INTERVAL_SECONDS:-300}
  WAN_RECONNECT_INITIAL_DELAY_SECONDS: ${WAN_RECONNECT_INITIAL_DELAY_SECONDS:-5}
  WAN_RECONNECT_MAX_DELAY_SECONDS: ${WAN_RECONNECT_MAX_DELAY_SECONDS:-300}
  WAN_OFFLINE_ALERT_THRESHOLD_SECONDS: ${WAN_OFFLINE_ALERT_THRESHOLD_SECONDS:-120}
  RECORDINGS_DIR: /data/recordings
  MODELS_DIR: /data/models
  DATASETS_DIR: /data/datasets
  THUMBNAILS_DIR: /data/thumbnails

# --- GPU reservation block (used by api + worker; no-op if USE_GPU=false) -
x-gpu: &gpu-reservation
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# =====================================================================
services:

  # --- API: FastAPI + WebSockets --------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vivoguard/api:latest
    container_name: vivoguard-api
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_started }
    networks: [vivoguard]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Celery worker: AI inference + training jobs --------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vivoguard/api:latest
    container_name: vivoguard-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/models:/data/models
      - ./data/datasets:/data/datasets
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [vivoguard]
    # GPU passthrough — comment out if no NVIDIA driver / nvidia-container-toolkit.
    # <<: *gpu-reservation

  # --- Streamer: FFmpeg subprocess pool -------------------------------
  streamer:
    build:
      context: ./streamer
      dockerfile: Dockerfile
    image: vivoguard/streamer:latest
    container_name: vivoguard-streamer
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./data/recordings:/data/recordings
    depends_on:
      redis: { condition: service_healthy }
      api:   { condition: service_started }
    networks: [vivoguard]

  # --- Frontend: Nginx serving the built React bundle -----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vivoguard/frontend:latest
    container_name: vivoguard-frontend
    restart: unless-stopped
    networks: [vivoguard]

  # --- Postgres -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vivoguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [vivoguard]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis: Celery broker + frame buffer ----------------------------
  redis:
    image: redis:7-alpine
    container_name: vivoguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [vivoguard]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- MinIO: S3-compatible object store ------------------------------
  minio:
    image: minio/minio:latest
    container_name: vivoguard-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [vivoguard]

  # --- Nginx: TLS termination + reverse proxy -------------------------
  nginx:
    image: nginx:alpine
    container_name: vivoguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks: [vivoguard]

# =====================================================================
networks:
  vivoguard:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
