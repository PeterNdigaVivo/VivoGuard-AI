# VivoGuard single-host NVIDIA inference and training override.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build worker-inference worker-training
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d worker-inference worker-training
#
# Keep GPU_BACKEND=cpu in the shared .env. This override builds a distinct
# CUDA image only for compute-heavy inference and training. Alert and recorder
# services retain the smaller CPU image and cannot overwrite this image tag
# during a full deployment.
services:
  worker-inference:
    image: vivoguard/worker:cuda
    build:
      args:
        GPU_BACKEND: cuda
    environment:
      GPU_BACKEND: cuda
      USE_GPU: "true"
      USE_OPTIMIZED: "true"
      # Start conservatively. Raise only after gpu-concurrency-benchmark.py
      # passes the documented p95/VRAM/error gates on the actual host.
      INFERENCE_SHARD_COUNT: ${INFERENCE_SHARD_COUNT:-1}
      INFERENCE_MAX_BATCH_SIZE: ${INFERENCE_MAX_BATCH_SIZE:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Training remains single-process so one fitting job owns the GPU at a time.
  # It shares the CUDA worker image with inference but keeps its dedicated
  # Celery queue, preserving alert-delivery and recorder isolation.
  worker-training:
    image: vivoguard/worker:cuda
    build:
      args:
        GPU_BACKEND: cuda
    environment:
      GPU_BACKEND: cuda
      USE_GPU: "true"
      USE_OPTIMIZED: "true"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_TRAINING_CONCURRENCY: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-inference-batch-shadow:
    image: vivoguard/worker:cuda
    build:
      args:
        GPU_BACKEND: cuda
    environment:
      GPU_BACKEND: cuda
      USE_GPU: "true"
      USE_OPTIMIZED: "true"
      INFERENCE_MAX_BATCH_SIZE: ${INFERENCE_MAX_BATCH_SIZE:-32}
      INFERENCE_BATCH_SIZE: ${INFERENCE_BATCH_SIZE:-8}
      INFERENCE_BATCH_REQUIRE_CUDA: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
