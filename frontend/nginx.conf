# Frontend container: just serve the SPA. The outer nginx reverse proxy
# (deploy/nginx/nginx.conf) handles TLS, /api, and /ws routing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed asset bundles produced by Vite.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history-mode fallback: every non-asset path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
