# Frontend container: just serve the SPA. The outer nginx reverse proxy
# (deploy/nginx/nginx.conf) handles TLS, /api, and /ws routing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed asset bundles produced by Vite.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached. It is the only file that names the
    # current hashed bundle, and /assets/ above is served immutable for a
    # year - so a browser holding a stale index.html keeps loading an old
    # bundle out of its own cache indefinitely, with nothing to dislodge
    # it. That is not theoretical: operators ran a broken False Alert
    # button for ~24h on 2026-10-26 because their cached index.html still
    # pointed at the bundle carrying the 422 bug, half a day after the fix
    # was deployed. The fallback below reaches this block by internal
    # redirect, so it covers deep links too.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA history-mode fallback: every non-asset path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
